name: CI - mathAPI

on:
  push:
    branches: [ master, main, devops ]
  pull_request:
    branches: [ master, main, devops ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Run tests
        run: npm test -- --runInBand --silent
      - name: Run build (if any)
        run: npm run build --if-present

  trigger-render-deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY or RENDER_SERVICE_ID secret is not set. Aborting deploy."
            repo="${{ github.repository }}"
            pr_number="${{ github.event.pull_request.number }}"
            title="[CI] Render deploy failed: missing secrets"
            body="RENDER_API_KEY or RENDER_SERVICE_ID is not set for workflow ${{ github.workflow }} on ref ${{ github.ref }}.\n\nActor: ${{ github.actor }}"
            if [ -n "${pr_number}" ] && [ "${pr_number}" != "null" ]; then
              echo "Posting comment to PR ${pr_number}"
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" \
                -d "{\"body\": \"${body}\"}" \
                "https://api.github.com/repos/${repo}/issues/${pr_number}/comments" || true
              echo "Adding label 'ci-failed' to PR ${pr_number}"
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" \
                -d '["ci-failed"]' "https://api.github.com/repos/${repo}/issues/${pr_number}/labels" || true
            else
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" \
                -d "{\"title\": \"${title}\", \"body\": \"${body}\", \"labels\": [\"ci-failed\"] }" \
                "https://api.github.com/repos/${repo}/issues" || true
            fi
            exit 1;
          fi
          echo "Triggering deploy for service $RENDER_SERVICE_ID"
          http_code=$(curl -s -o /tmp/render_resp -w "%{http_code}" -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' || true)
          echo "--- Render response body ---"
          cat /tmp/render_resp || true
          echo "--- end response ---"
          echo "Render response HTTP status: $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Render deploy returned non-2xx status: $http_code"
            repo="${{ github.repository }}"
            pr_number="${{ github.event.pull_request.number }}"
            title="[CI] Render deploy failed: webhook returned $http_code"
            body="Render deploy webhook returned HTTP status $http_code for workflow ${{ github.workflow }} on ref ${{ github.ref }}. Check the workflow logs for full response.\n\nActor: ${{ github.actor }}"
            if [ -n "${pr_number}" ] && [ "${pr_number}" != "null" ]; then
              echo "Posting comment to PR ${pr_number}"
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" \
                -d "{\"body\": \"${body}\"}" \
                "https://api.github.com/repos/${repo}/issues/${pr_number}/comments" || true
              echo "Adding label 'ci-failed' to PR ${pr_number}"
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" \
                -d '["ci-failed"]' "https://api.github.com/repos/${repo}/issues/${pr_number}/labels" || true
            else
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" \
                -d "{\"title\": \"${title}\", \"body\": \"${body}\", \"labels\": [\"ci-failed\"] }" \
                "https://api.github.com/repos/${repo}/issues" || true
            fi
            exit 1
          fi

  newman-math:
    name: Newman - mathApi
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (mathApi)
        run: |
          if [ ! -d "./mathApi" ]; then
            echo "Directory ./mathApi not found. Listing repo root:";
            ls -la
            exit 1
          fi
          npm --prefix ./mathApi install --no-audit --no-fund

      - name: Start mathApi server
        env:
          PORT: 8080
          NODE_ENV: development
        run: |
          # start server from project folder and save logs for debugging
          if [ ! -d "./mathApi" ]; then
            echo "Directory ./mathApi not found. Listing repo root:";
            ls -la
            exit 1
          fi
          npm --prefix ./mathApi run start > ./mathApi/server.log 2>&1 &
          n=0
          until curl -sSf http://localhost:8080/ >/dev/null 2>&1 || [ $n -ge 60 ]; do
            n=$((n+1))
            echo "waiting for server... $n"
            sleep 1
          done
          if [ $n -ge 60 ]; then
            echo "Server did not start in time"
            echo "---- server.log ----"
            tail -n 200 ./mathApi/server.log || true
            exit 1
          fi

      - name: Run Newman collection (math)
        run: |
          if [ ! -d "./mathApi" ]; then
            echo "Directory ./mathApi not found. Listing repo root:";
            ls -la
            exit 1
          fi
          npm --prefix ./mathApi install newman --no-save
          # show server log head before running tests for context
          echo "---- server.log (head) ----"
          head -n 200 ./mathApi/server.log || true
          ./mathApi/node_modules/.bin/newman run postman/math.postman_collection.json -e postman/math.postman_environment.json --timeout-request 15000 --bail || {
            echo "Newman failed; dumping server.log";
            echo "---- server.log (full) ----";
            tail -n +1 ./mathApi/server.log || true;
            exit 1;
          }

  notify-on-failure:
    name: Notify on CI failure
    needs: build
    if: ${{ needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create issue about CI failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          title="[CI] mathApi: build/tests failed on ${{ github.ref }}"
          body="CI job 'build' failed for commit ${{ github.sha }}. See the Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nActor: ${{ github.actor }}"
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d "{\"title\": \"${title}\", \"body\": \"${body}\", \"labels\": [\"ci-failed\"] }" \
            "https://api.github.com/repos/${repo}/issues" || true
