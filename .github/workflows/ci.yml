name: CI - mathAPI

on:
  push:
    branches: [ master, main, devops ]
  pull_request:
    branches: [ master, main, devops ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Run unit and HTTP contract tests
        run: npm test -- --runInBand

  newman-math:
    name: Newman - mathApi
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies (mathApi)
        run: npm ci --no-audit --no-fund
      - name: Start mathApi server
        run: |
          touch server.log || true
          npm run start > ./server.log 2>&1 &
          echo $! > server.pid
          n=0
          until curl -sSf http://localhost:8080/ >/dev/null 2>&1 || [ $n -ge 30 ]; do
            n=$((n+1))
            echo "waiting for server... $n"
            sleep 1
          done
          if [ $n -ge 30 ]; then
            echo "Server did not start in time"
            tail -n 60 ./server.log || true
            exit 1
          fi
      - name: Run Newman collection (math)
        run: |
          npm install newman --no-save
          npx newman run postman/math.postman_collection.json -e postman/math.postman_environment.json --timeout-request 15000 --bail || {
            echo "Newman failed; dumping server.log"
            tail -n 60 ./server.log || true
            exit 1
          }
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: math-newman-server-log
          path: server.log
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm -f server.pid
          fi

  infra-tests:
    name: Infra Tests - mathApi (runtime HTTP smoke)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Start mathApi server
        run: |
          touch server.log || true
          npm run start > ./server.log 2>&1 &
          echo $! > server.pid
      - name: Verify readiness and representative calculation endpoints
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -sfS http://localhost:8080/ >/dev/null 2>&1; then
              echo "service is up"; break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::service did not become ready in time"
              tail -n 60 ./server.log || true
              exit 1
            fi
            sleep 1
          done
          node -e "
            (async () => {
              const r = await fetch('http://127.0.0.1:8080/estequiometria/balanceamento', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ equacao: 'H2 + O2 -> H2O' })
              });
              const j = await r.json();
              if (r.status !== 200 || !j.success || j.data?.equacaoBalanceada !== '2 H2 + O2 -> 2 H2O') {
                throw new Error('Unexpected smoke response: ' + JSON.stringify(j));
              }
              console.log('HTTP runtime smoke OK:', j.data.equacaoBalanceada);
            })().catch((e) => { console.error(e); process.exit(1); });
          "
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: math-server-log
          path: server.log
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm -f server.pid
          fi

  notify-on-failure:
    name: Notify on CI failure
    needs: build
    if: ${{ needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create issue about CI failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          title="[CI] mathApi: build/tests failed on ${{ github.ref }}"
          body="CI job 'build' failed for commit ${{ github.sha }}. See the Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nActor: ${{ github.actor }}"
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d "{\"title\": \"${title}\", \"body\": \"${body}\", \"labels\": [\"ci-failed\"] }" \
            "https://api.github.com/repos/${repo}/issues" || true
