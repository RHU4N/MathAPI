name: CI - mathAPI

on:
  push:
    branches: [ master, main, devops ]
  pull_request:
    branches: [ master, main, devops ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Run tests
        run: npm test -- --runInBand --silent

  infra-tests:
    name: Infra Tests - mathApi (start + Newman + smoke)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start mathApi server
        run: |
          touch server.log || true
          npm run start > ./server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for service (health check)
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -sfS http://localhost:8080/ >/dev/null 2>&1; then
              echo "service is up"; exit 0
            fi
            if curl -sfS http://localhost:8080/health >/dev/null 2>&1; then
              echo "service is healthy"; exit 0
            fi
            echo "waiting for service... ($i)"; sleep 2
          done
          echo "::error::service did not become ready in time"
          tail -n 200 ./server.log || true
          exit 1

      - name: Install Newman
        run: npm install newman --no-save

      - name: Run Newman collection (math)
        run: |
          echo "---- server.log (head) ----"
          head -n 200 ./server.log || true
          ./node_modules/.bin/newman run postman/math.postman_collection.json -e postman/math.postman_environment.json --timeout-request 15000 --bail || {
            echo "Newman failed; dumping server.log";
            echo "---- server.log (full) ----";
            tail -n +1 ./server.log || true;
            exit 1;
          }

      - name: Run extra infra checks (run-tests.js)
        run: |
          if [ -f run-tests.js ]; then
            node run-tests.js || (echo "run-tests.js failed"; tail -n 200 ./server.log || true; exit 1)
          else
            echo "No run-tests.js present; skipping"
          fi

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: math-server-log
          path: server.log

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm -f server.pid
          fi

  notify-on-failure:
    name: Notify on CI failure
    needs: build
    if: ${{ needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create issue about CI failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          title="[CI] mathApi: build/tests failed on ${{ github.ref }}"
          body="CI job 'build' failed for commit ${{ github.sha }}. See the Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nActor: ${{ github.actor }}"
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d "{\"title\": \"${title}\", \"body\": \"${body}\", \"labels\": [\"ci-failed\"] }" \
            "https://api.github.com/repos/${repo}/issues" || true
